<div class="system-body">
    
    <!-- Etapa 1: Primeira Vez -->
    <div class="step-content active" data-step="1">
      <div class="form-group">
        <label>É a sua primeira vez na Titan Performance?</label>
        <div class="options-grid">
          <div class="option-card" onclick="selectOption(1, 'primeiraVez', 'Sim, primeira vez', this)">Sim, primeira vez</div>
          <div class="option-card" onclick="selectOption(1, 'primeiraVez', 'Já sou aluno/Retorno', this)">Já sou aluno / Retorno</div>
        </div>
      </div>
    </div>

    <!-- Etapa 2: Objetivo -->
    <div class="step-content" data-step="2">
      <div class="form-group">
        <label>Qual é o seu objetivo principal?</label>
        <div class="options-grid">
          <div class="option-card" onclick="selectOption(2, 'objetivo', 'Emagrecimento', this)">Emagrecimento</div>
          <div class="option-card" onclick="selectOption(2, 'objetivo', 'Hipertrofia', this)">Hipertrofia</div>
          <div class="option-card" onclick="selectOption(2, 'objetivo', 'Condicionamento Físico', this)">Condicionamento Físico</div>
          <div class="option-card" onclick="selectOption(2, 'objetivo', 'Saúde e Bem-estar', this)">Saúde e Bem-estar</div>
          <div class="option-card" onclick="selectOption(2, 'objetivo', 'Performance', this)">Performance</div>
        </div>
      </div>
    </div>

    <!-- Etapa 3: Modalidade -->
    <div class="step-content" data-step="3">
      <div class="form-group">
        <label>Qual modalidade deseja experimentar?</label>
        <div class="options-grid">
          <div class="option-card" onclick="selectOption(3, 'modalidade', 'Musculação', this)">Musculação</div>
          <div class="option-card" onclick="selectOption(3, 'modalidade', 'Cross Training', this)">Cross Training</div>
          <div class="option-card" onclick="selectOption(3, 'modalidade', 'Pilates Solo', this)">Pilates Solo</div>
          <div class="option-card" onclick="selectOption(3, 'modalidade', 'Funcional', this)">Funcional</div>
          <div class="option-card" onclick="selectOption(3, 'modalidade', 'Muay Thai / Boxe', this)">Muay Thai / Boxe</div>
          <div class="option-card" onclick="selectOption(3, 'modalidade', 'Avaliação Física Completa', this)">Avaliação Física Completa</div>
        </div>
      </div>
    </div>

    <!-- Etapa 4: Data -->
    <div class="step-content" data-step="4">
      <div class="form-group">
        <label for="dataInput">Selecione a data pretendida:</label>
        <input type="date" id="dataInput" class="form-control" onchange="saveInput('data', this.value)">
      </div>
    </div>

    <!-- Etapa 5: Horário -->
    <div class="step-content" data-step="5">
      <div class="form-group">
        <label>Selecione o horário de atendimento:</label>
        <div class="options-grid">
          <div class="option-card" onclick="selectOption(5, 'horario', '07:00 - Manhã', this)">07:00 - Manhã</div>
          <div class="option-card" onclick="selectOption(5, 'horario', '09:00 - Manhã', this)">09:00 - Manhã</div>
          <div class="option-card" onclick="selectOption(5, 'horario', '12:00 - Almoço', this)">12:00 - Almoço</div>
          <div class="option-card" onclick="selectOption(5, 'horario', '17:00 - Tarde', this)">17:00 - Tarde</div>
          <div class="option-card" onclick="selectOption(5, 'horario', '19:00 - Noite', this)">19:00 - Noite</div>
          <div class="option-card" onclick="selectOption(5, 'horario', '20:30 - Noite', this)">20:30 - Noite</div>
        </div>
      </div>
    </div>

    <!-- Etapa 6: Nome -->
    <div class="step-content" data-step="6">
      <div class="form-group">
        <label for="nomeInput">Seu Nome Completo:</label>
        <input type="text" id="nomeInput" class="form-control" placeholder="Ex: Carlos Silva" oninput="saveInput('nome', this.value)">
      </div>
    </div>

    <!-- Etapa 7: WhatsApp -->
    <div class="step-content" data-step="7">
      <div class="form-group">
        <label for="whatsappInput">Seu WhatsApp (com DDD):</label>
        <input type="tel" id="whatsappInput" class="form-control" placeholder="(11) 99999-9999" oninput="maskPhone(this); saveInput('whatsapp', this.value)">
      </div>
    </div>

    <!-- Etapa 8: E-mail -->
    <div class="step-content" data-step="8">
      <div class="form-group">
        <label for="emailInput">Seu E-mail:</label>
        <input type="email" id="emailInput" class="form-control" placeholder="seu@email.com" oninput="saveInput('email', this.value)">
      </div>
    </div>

    <!-- Etapa 9: Observações -->
    <div class="step-content" data-step="9">
      <div class="form-group">
        <label for="obsInput">Observações ou Restrições (Opcional):</label>
        <input type="text" id="obsInput" class="form-control" placeholder="Ex: Tenho leve dor no joelho" oninput="saveInput('observacoes', this.value)">
      </div>
    </div>

    <!-- Etapa 10: Resumo e Confirmação -->
    <div class="step-content" data-step="10">
      <div class="form-group">
        <label style="margin-bottom: 1rem;">Resumo do seu Agendamento:</label>
        <div class="summary-box" id="summaryBox">
          <!-- Preenchido via JS -->
        </div>
      </div>
    </div>

  </div>

  <div class="system-footer">
    <button class="btn-nav btn-back" id="btnBack" onclick="prevStep()" style="visibility: hidden;">Voltar</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="nextStep()">Avançar</button>
  </div>
</div>
